# Apply with your real key:
# kubectl create secret generic api-secrets \
#   --from-literal=anthropic-api-key=sk-ant-... \
#   -n multi-agent-research
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: multi-agent-research
type: Opaque
stringData:
  anthropic-api-key: "REPLACE_ME"
